services:
  server:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      STORAGE_LOCAL_ROOT: /var/lib/oronbox/blobs
      CONSOLE_DIR: /var/lib/oronbox/console
    volumes:
      # The volume contains the `blobs/` directory itself.
      - blob-data:/var/lib/oronbox
      - console-data:/var/lib/oronbox/console

volumes:
  blob-data:
    # Production data volume. Keep this external so a redeploy cannot create
    # a new empty volume under the compose project name.
    external: true
    name: oronbox-data
  console-data:
