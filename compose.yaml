services:
  server:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      STORAGE_LOCAL_ROOT: /var/lib/oronbox/blobs
      CONSOLE_DIR: /var/lib/oronbox/console
    volumes:
      - blob-data:/var/lib/oronbox/blobs
      - console-data:/var/lib/oronbox/console

volumes:
  blob-data:
  console-data:
